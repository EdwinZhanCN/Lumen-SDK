name: Proto contract

on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'proto/**'
            - 'Taskfile.yml'
            - '.github/workflows/proto-contract.yml'
    push:
        branches: [main]
        paths:
            - 'proto/**'
            - 'Taskfile.yml'
            - '.github/workflows/proto-contract.yml'

permissions:
    contents: read

env:
    GO_VERSION: '1.25'

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - uses: arduino/setup-task@v2
              with:
                  version: 3.52.0

            - name: Install pinned proto tools
              run: |
                  curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64 -o /usr/local/bin/buf
                  chmod +x /usr/local/bin/buf
                  curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip -o /tmp/protoc.zip
                  sudo unzip -q -o /tmp/protoc.zip -d /usr/local 'bin/protoc*' 'include/*'
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.8
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

            - name: Verify generated code and wire compatibility
              run: task proto-verify
