name: Release

on:
    push:
        tags:
            - "v*.*.*"
    # Manual runs validate tests, cross-platform builds, and artifacts.
    # Publishing remains restricted to version tag pushes below.
    workflow_dispatch: {}

permissions:
    contents: read

env:
    GO_VERSION: '1.25'

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Verify dependencies
              run: go mod verify

            - name: Run repository checks
              run: make ci

    build:
        name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest
        needs: test
        strategy:
            fail-fast: false
            matrix:
                goos: [linux, darwin, windows]
                goarch: [amd64, arm64]
                exclude:
                    - goos: windows
                      goarch: arm64
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Build lumen-hostd
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  set -eu
                  mkdir -p dist
                  version="${GITHUB_REF_NAME}"
                  commit="${GITHUB_SHA}"
                  build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  extension=""
                  if [ "${GOOS}" = "windows" ]; then
                    extension=".exe"
                  fi
                  CGO_ENABLED=0 go build \
                    -ldflags="-X 'main.Version=${version}' -X 'main.Commit=${commit}' -X 'main.BuildTime=${build_time}' -s -w" \
                    -o "dist/lumen-hostd${extension}" \
                    ./cmd/lumen-hostd

            - name: Create archive
              run: |
                  set -eu
                  cd dist
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    7z a "lumen-hostd-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" lumen-hostd.exe
                  else
                    tar -czf "lumen-hostd-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" lumen-hostd
                  fi

            - uses: actions/upload-artifact@v4
              with:
                  name: lumen-hostd-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: |
                      dist/*.tar.gz
                      dist/*.zip
                  if-no-files-found: error

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: [test, build]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Create checksums
              working-directory: release-assets
              run: sha256sum *.tar.gz *.zip > SHA256SUMS

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  generate_release_notes: true
                  body: |
                      ## Lumen Host Broker ${{ github.ref_name }}

                      Direct mDNS or static addresses remain the default discovery paths.
                      `lumen-hostd` is an optional compatibility bridge for applications that
                      cannot perform local-network discovery themselves, such as workloads in
                      Docker Desktop. It republishes discovery state over `/v1/nodes/watch`
                      and never proxies inference payloads.

                      ### Install

                      Download the archive for your platform, extract `lumen-hostd` (or
                      `lumen-hostd.exe` on Windows), and place it on your `PATH`.

                      macOS builds are currently unsigned and not notarized. If Gatekeeper
                      quarantines the binary, run:

                      ```sh
                      xattr -d com.apple.quarantine lumen-hostd
                      ```

                      Run it as a per-user background service:

                      ```sh
                      lumen-hostd install
                      lumen-hostd status
                      lumen-hostd doctor
                      lumen-hostd uninstall
                      ```

                      Or run it in the foreground with `lumen-hostd serve`.
                  draft: false
                  prerelease: false
                  files: |
                      release-assets/*.tar.gz
                      release-assets/*.zip
                      release-assets/SHA256SUMS
