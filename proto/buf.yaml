version: v2
deps:
  - buf.build/protocolbuffers/wellknowntypes
lint:
  use:
    - STANDARD
  # The data-plane contract is frozen by the product plan: the RPC response
  # types (`Capability`), the `Inference` service name, and the file layout
  # (`proto/ml_service.proto` with package `home_native.v1`) are all part of
  # the wire contract and cannot be renamed without a protocol-major release.
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - WIRE_JSON
